version: '3.8'

services:
  biblestem:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblestem
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    labels:
      - 'com.biblestem.description=BibleStem Next.js Application'
      - 'com.biblestem.version=1.0.0'
