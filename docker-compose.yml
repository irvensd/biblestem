version: '3.8'

services:
  biblestem:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblestem
    ports:
      - "80:80"
    environment:
      - VITE_ENVIRONMENT=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.biblestem.description=BibleStem Vue Application"
      - "com.biblestem.version=1.0.0"

