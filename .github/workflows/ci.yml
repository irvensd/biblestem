name: CI

on:
  push:
    branches: [main, production, develop]
  pull_request:
    branches: [main, production]

jobs:
  app-readiness:
    name: App readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, lesson copy rules
        run: npm run check:app-readiness

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [app-readiness]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
